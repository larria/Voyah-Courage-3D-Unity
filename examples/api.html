<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知音组件 API 测试页</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font:14px system-ui;color:#263238;background:#fff}#viewer{position:absolute;inset:0 380px 0 0}.controls{position:absolute;right:12px;top:12px;bottom:12px;width:356px;background:#f8fafbed;border:1px solid #dde3e7;border-radius:14px;box-shadow:0 8px 32px #0002;padding:18px;overflow:auto;overscroll-behavior:contain}h1{font-size:20px;margin:0 0 12px}h2{font-size:15px;margin:20px 0 8px}button,select,input{font:inherit;margin:3px;padding:8px;border:1px solid #ccd5da;border-radius:6px;background:white}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}button:hover{background:#edf4f8}input,select{max-width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;background:#edf1f4;padding:12px;max-height:180px;overflow:auto}.notice{font-size:12px;color:#647681;line-height:1.6}#toggle-panel{position:absolute;right:24px;top:20px;z-index:2}body.panel-hidden .controls{display:none}details{margin-top:16px}summary{cursor:pointer;font-weight:600}#feedback{position:sticky;top:0;background:#f8fafb;padding:6px 0;font-size:12px;color:#355e77;z-index:1}section{padding-bottom:8px;border-bottom:1px solid #e1e7eb}
@media(max-width:700px){#viewer{inset:0 0 45% 0}.controls{top:55%;bottom:8px;left:8px;right:8px;width:auto;border-radius:14px 14px 8px 8px;padding:12px}#toggle-panel{top:auto;bottom:calc(45% + 10px);right:12px}body.panel-hidden #toggle-panel{bottom:calc(45% + 10px)}h1{font-size:17px}}
</style><div id="viewer"></div><button id="toggle-panel" aria-controls="control-panel" aria-expanded="true">收起控制台</button><main class="controls" id="control-panel"><div id="feedback" role="status">正在初始化…</div><h1>知音 JS 组件 · API 测试</h1><p class="notice">命令结果 dispatched 仅代表派发，不代表动画完成或车辆状态回读。实验接口的数值含义须自行核验。</p><section aria-labelledby="paint-heading"><h2 id="paint-heading">外观颜色</h2><div id="paint-buttons"></div></section><section aria-labelledby="interior-heading"><h2 id="interior-heading">内饰颜色</h2><div id="interior-buttons"></div></section><section aria-labelledby="charging-heading"><h2 id="charging-heading">充电展示</h2><div id="charging-buttons"></div><p class="notice">充电与充电线显示分别提供按钮，不会自动切换相机。充电线显示/隐藏命令会停止充电流动；需要流动效果时请随后开启充电。请拖动模型至右后侧观察充电口和充电线；请求状态不代表真实回读或动画完成。</p></section><section aria-labelledby="actions-heading"><h2 id="actions-heading">车辆操作</h2><div id="buttons"></div></section><button id="destroy">销毁</button><button id="mount">重新挂载</button><button id="state">读取能力与请求状态</button><details><summary>实验运行时接口</summary><select id="method"></select><input id="value" value="0" aria-label="参数"><button id="send">派发实验命令</button></details><details><summary>能力限制</summary><p>门速、轮转角和幂等尾门状态仍未提供。四门、四窗已通过构建校验的原始 WASM 方法调用实现；只支持当前已验证构建，升级模型需重新验证。</p></details><details><summary>操作日志</summary><pre id="log"></pre></details></main><script type="module">
import { CarPlayer, PAINTS, INTERIORS, RUNTIME_METHODS } from '../components/car-player.js';
let player;
const log=document.querySelector('#log');
const records=[];
function write(value){records.unshift(JSON.stringify(value,null,2));records.length=Math.min(records.length,40);log.textContent=records.join('\n');const detail=value?.detail;if(value?.error)document.querySelector('#feedback').textContent=value.error;else if(value?.event==='ready')document.querySelector('#feedback').textContent='模型已就绪';else if(value?.status==='dispatched')document.querySelector('#feedback').textContent='已派发：'+value.method;else if(value?.event==='error')document.querySelector('#feedback').textContent=detail?.message||'加载失败';}
document.querySelector('#toggle-panel').onclick=()=>{const hidden=document.body.classList.toggle('panel-hidden');const button=document.querySelector('#toggle-panel');button.textContent=hidden?'展开控制台':'收起控制台';button.setAttribute('aria-expanded',String(!hidden));};
function mount(){try{player=new CarPlayer(document.querySelector('#viewer'));window.player=player;for(const event of ['progress','ready','command','error','destroyed'])player.addEventListener(event,e=>write({event,detail:e.detail}));player.ready().catch(e=>write({code:e.code,error:e.message}));}catch(e){write({code:e.code,error:e.message});}}
const buttons=document.querySelector('#buttons');
function button(label,method,value,group=buttons){const b=document.createElement('button');b.textContent=label;b.addEventListener('click',async()=>{try{write(await player[method](value));}catch(e){write({code:e.code,error:e.message});}});group.append(b);}
for(const [code,label] of Object.entries(PAINTS))button(label,'setPaint',code,document.querySelector('#paint-buttons'));
for(const [code,label] of Object.entries(INTERIORS))button(label,'setInterior',code,document.querySelector('#interior-buttons'));
for(const [name,method] of [['大灯','setHeadlights'],['行驶','setDriving'],['后视镜','setMirrors']]){button(name+'开',''+method,true);button(name+'关',''+method,false);}
const chargingButtons=document.querySelector('#charging-buttons');
button('开启充电','setCharging',true,chargingButtons);
button('停止充电','setCharging',false,chargingButtons);
button('显示充电线','setChargingCableVisible',true,chargingButtons);
button('隐藏充电线','setChargingCableVisible',false,chargingButtons);
for (const i of [0,1,2]) button('相机预设'+i,'setCameraPreset',i);
for (const i of [0,1]) button('轮毂'+i,'setWheelType',i);
button('尾门切换','toggleTrunk');
for (const id of ['LF','LB','RF','RB']) {
  for (const [label,method] of [['门','setDoor'],['窗','setWindow']]) {
    for (const open of [true,false]) {
      const b=document.createElement('button');b.textContent=id+label+(open?'开':'关');
      b.onclick=async()=>{try{write(await player[method](id,open));}catch(e){write({code:e.code,error:e.message});}};
      buttons.append(b);
    }
  }
}
button('转向灯闪烁','flashTurnSignals');
button('寻车','findCar');
for (const [name,method] of [['日行灯','setDaytimeRunningLights'],['位置灯','setPositionLights'],['锁车','setLocked']]) { button(name+'开',method,true); button(name+'关',method,false); }
document.querySelector('#destroy').onclick=async()=>{const mountButton=document.querySelector('#mount'),destroyButton=document.querySelector('#destroy');mountButton.disabled=destroyButton.disabled=true;try{await player.destroy();write('已销毁');document.querySelector('#feedback').textContent='已销毁，可重新挂载';}catch(e){write({error:e.message});}finally{mountButton.disabled=destroyButton.disabled=false;}};
document.querySelector('#mount').onclick=mount;
document.querySelector('#state').onclick=()=>write({capabilities:player.getCapabilities(),state:player.getState()});
const select=document.querySelector('#method');for(const [name,type] of Object.entries(RUNTIME_METHODS)){const o=document.createElement('option');o.value=name;o.textContent=name+' ('+type+')';select.append(o);}
document.querySelector('#send').onclick=async()=>{try{const name=select.value,type=RUNTIME_METHODS[name],text=document.querySelector('#value').value;write(await player.experimental.invoke(name,type==='none'?undefined:type==='integer'?Number(text):text));}catch(e){write({code:e.code,error:e.message});}};
mount();
</script></html>
