<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>全新岚图知音 · 外观 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#333;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.stage{position:relative;height:clamp(420px,76svh,1000px);width:100%;background:#fff;overflow:hidden}.car-canvas{width:100%;height:100%;display:block;touch-action:none;background:transparent}.stage:fullscreen{height:100vh;height:100dvh;background:white}@media(max-width:600px){.stage{height:clamp(360px,68svh,760px)}}.expand{position:absolute;top:18px;left:20px;border:0;border-radius:50%;background:#ffffffc9;width:32px;height:32px;cursor:pointer}.panel{padding:22px 20px;max-width:1000px;margin:auto}h1{font-size:18px;font-weight:500;margin:0 0 22px}.colors{display:flex;gap:18px;margin:16px 0 22px}.color{border:1px solid #ddd;border-radius:50%;width:34px;height:34px;cursor:pointer}.color.selected{outline:1px solid #444;outline-offset:4px}.status{font-size:12px;color:#888}.hint{color:#777;line-height:1.8;font-size:12px}button:disabled{cursor:wait;opacity:.5}
</style>
</head>
<body>
<div class="stage" id="stage"><button class="expand" title="全屏" id="expand">⤢</button></div>
<div class="panel"><h1>全新岚图知音</h1><div>外观颜色 · <span id="color-name">香槟金</span></div><div class="colors">
<button disabled class="color selected" data-code="QGJ" data-name="香槟金" style="background:#bcb29b" title="香槟金"></button>
<button disabled class="color" data-code="XYH" data-name="玄英黑" style="background:#202123" title="玄英黑"></button>
<button disabled class="color" data-code="JSH" data-name="宸星灰" style="background:#747778" title="宸星灰"></button>
<button disabled class="color" data-code="NUB" data-name="杜若白" style="background:#eee" title="杜若白"></button>
</div><div>内饰颜色 · <span id="interior-name">旭日红</span></div><div class="colors"><button disabled class="color selected" data-interior="R" style="background:#9b4f45" title="旭日红"></button><button disabled class="color" data-interior="P" style="background:#27384c" title="深海蓝"></button><button disabled class="color" data-interior="Q" style="background:#eee8dd" title="皓月白"></button></div><div class="status" id="status">正在加载官网原始模型…</div><p class="hint">拖动旋转，滚轮或双指缩放。直接点击车辆可交互部位操作门、窗和尾门；点击与动画由原始 Unity 程序处理。</p></div>
<script type="module" src="tools/direct-player.js"></script>
</body></html>
