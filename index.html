<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>全新岚图知音 · 外观 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#333;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.stage{position:relative;height:300px;width:100%;}iframe{width:100%;height:300px;border:0;display:block}.stage:fullscreen{height:100vh;background:white}.stage:fullscreen iframe{height:100vh}.expand{position:absolute;top:18px;left:20px;border:0;border-radius:50%;background:#ffffffc9;width:32px;height:32px;cursor:pointer}.label{position:absolute;bottom:10px;left:20px;color:#ccc;font-size:11px;pointer-events:none}.tab{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);padding:6px 12px;border-radius:5px;background:#f4f7f8;color:#333;pointer-events:none}.panel{padding:22px 20px;max-width:1000px;margin:auto}h1{font-size:18px;font-weight:500;margin:0 0 22px}.colors{display:flex;gap:18px;margin:16px 0 22px}.color{border:1px solid #ddd;border-radius:50%;width:34px;height:34px;cursor:pointer}.color.selected{outline:1px solid #444;outline-offset:4px}.status{font-size:12px;color:#888}.hint{color:#777;line-height:1.8;font-size:12px}button:disabled{cursor:wait;opacity:.5}
</style>
</head>
<body>
<div class="stage" id="stage"><iframe id="player" title="官网原版外观3D" src="unity-player/index.html?featureCodes=LDB,T,DR19,MPVALLSHEHAHF"></iframe><button class="expand" title="全屏" id="expand">⤢</button><span class="label">*图片仅供参考</span><span class="tab">外观</span></div>
<div class="panel"><h1>全新岚图知音</h1><div>外观颜色 · <span id="color-name">香槟金</span></div><div class="colors">
<button disabled class="color selected" data-code="QGJ" data-name="香槟金" style="background:#bcb29b" title="香槟金"></button>
<button disabled class="color" data-code="XYH" data-name="玄英黑" style="background:#202123" title="玄英黑"></button>
<button disabled class="color" data-code="JSH" data-name="宸星灰" style="background:#747778" title="宸星灰"></button>
<button disabled class="color" data-code="NUB" data-name="杜若白" style="background:#eee" title="杜若白"></button>
</div><div class="status" id="status">正在加载官网原始模型…</div><p class="hint">拖动旋转，滚轮或双指缩放。直接点击车辆可交互部位操作门、窗和尾门；点击与动画由原始 Unity 程序处理。此页面不提供内饰模式。</p></div>
<script>
const frame=document.getElementById('player');
let initialized=false;
window.addEventListener('message',event=>{
 if(event.source!==frame.contentWindow||event.origin!==location.origin)return;
 const data=event.data;
 if(data?.type!=='dyglLoading')return;
 if(data.msg==='progress')document.getElementById('status').textContent=`加载模型 ${Math.round(data.progress*100)}%`;
 if(data.msg==='done'&&!initialized){initialized=true;setTimeout(()=>{
 frame.contentWindow.dyglVoyah('exteriorTab','QGJ');
 document.querySelectorAll('.color').forEach(b=>b.disabled=false);
 document.getElementById('status').textContent='外观 3D 已就绪';
 },400);}
});
document.querySelectorAll('.color').forEach(button=>button.addEventListener('click',()=>{
 frame.contentWindow.dyglVoyah('exterior',button.dataset.code);
 document.querySelectorAll('.color').forEach(b=>b.classList.toggle('selected',b===button));
 document.getElementById('color-name').textContent=button.dataset.name;
}));
document.getElementById('expand').addEventListener('click',()=>{
 if(document.fullscreenElement)document.exitFullscreen();else document.getElementById('stage').requestFullscreen();
});
</script>
</body></html>
